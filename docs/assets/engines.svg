<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="ecard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141722"/><stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <radialGradient id="eglowP" cx="0.9" cy="0" r="1.1">
      <stop offset="0" stop-color="#ff4d8f" stop-opacity="0.16"/><stop offset="1" stop-color="#ff4d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eglowV" cx="0.02" cy="1" r="1.1">
      <stop offset="0" stop-color="#a238ff" stop-opacity="0.14"/><stop offset="1" stop-color="#a238ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="898" height="468" rx="22" fill="url(#ecard)" stroke="#2a2c3c"/>
  <rect x="1" y="1" width="898" height="468" rx="22" fill="url(#eglowP)"/>
  <rect x="1" y="1" width="898" height="468" rx="22" fill="url(#eglowV)"/>

  <text x="40" y="52" fill="#e8e8f8" font-size="20" font-weight="700" letter-spacing="0.3">Engines</text>
  <text x="40" y="74" fill="#9494ae" font-size="12.5">Where a track comes from, and what plays it back</text>

  <text x="40" y="112" fill="#c9c9de" font-size="12" font-weight="700" letter-spacing="1">SOURCE ENGINES</text>
  <line x1="40" y1="122" x2="860" y2="122" stroke="#22242f"/>

  <!-- monogram helper look: circle + letter + name + capability -->
  <!-- row 1 -->
  <g transform="translate(40,140)">
    <circle cx="24" cy="24" r="24" fill="#0f1a24" stroke="#4a90c2" stroke-width="1.8"/>
    <text x="24" y="30" text-anchor="middle" fill="#7ec8f0" font-size="17" font-weight="800">D</text>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">Deezer</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">FLAC 16/44 · Blowfish decrypt · needs your ARL</text>
  </g>
  <g transform="translate(320,140)">
    <circle cx="24" cy="24" r="24" fill="#111a12" stroke="#3ecfaa" stroke-width="1.8"/>
    <text x="24" y="30" text-anchor="middle" fill="#68e6c4" font-size="17" font-weight="800">Q</text>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">Qobuz</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">FLAC up to 24/192 · auth token or login</text>
  </g>
  <g transform="translate(600,140)">
    <circle cx="24" cy="24" r="24" fill="#0f1220" stroke="#8f9bff" stroke-width="1.8"/>
    <text x="24" y="30" text-anchor="middle" fill="#aab3ff" font-size="17" font-weight="800">T</text>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">Tidal</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">FLAC + HI-RES via MPEG-DASH · access token</text>
  </g>
  <!-- row 2 -->
  <g transform="translate(40,208)">
    <circle cx="24" cy="24" r="24" fill="#20140a" stroke="#ff8a3d" stroke-width="1.8"/>
    <text x="24" y="30" text-anchor="middle" fill="#ffb27a" font-size="14" font-weight="800">SC</text>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">SoundCloud</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">lossless where offered, else high AAC · HLS / progressive</text>
  </g>
  <g transform="translate(320,208)">
    <circle cx="24" cy="24" r="24" fill="#1e0f12" stroke="#ff4d5e" stroke-width="1.8"/>
    <text x="24" y="30" text-anchor="middle" fill="#ff8a95" font-size="17" font-weight="800">Я</text>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">Yandex Music</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">FLAC with Plus · OAuth token</text>
  </g>
  <g transform="translate(600,208)">
    <circle cx="24" cy="24" r="24" fill="#151515" stroke="#c9c9de" stroke-width="1.8"/>
    <path d="M24 12 c-3 5 -6 8 -6 13 a6 6 0 0 0 12 0 c0 -5 -3 -8 -6 -13 z" fill="#e6e6f0"/>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">BBC</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">public — nothing to connect</text>
  </g>

  <text x="40" y="290" fill="#c9c9de" font-size="12" font-weight="700" letter-spacing="1">THROUGH A PAIRED PC</text>
  <line x1="40" y1="300" x2="860" y2="300" stroke="#22242f"/>
  <g transform="translate(40,318)">
    <circle cx="24" cy="24" r="24" fill="#1a1414" stroke="#ff6b8f" stroke-width="1.8"/>
    <path d="M24 11 c-3 5 -6 8 -6 13 a6 6 0 0 0 12 0 c0 -5 -3 -8 -6 -13 z" fill="#ff9ab3"/>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">Apple Music</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">ALAC via the PC's decrypt wrapper · storefront from the PC</text>
  </g>
  <g transform="translate(430,318)">
    <circle cx="24" cy="24" r="24" fill="#0f1a12" stroke="#1db954" stroke-width="1.8"/>
    <g stroke="#4ee27e" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M13 20 q11 -5 22 1"/><path d="M14 26 q10 -4 19 1"/><path d="M16 32 q8 -3 15 1"/>
    </g>
    <text x="60" y="20" fill="#e8e8f8" font-size="13.5" font-weight="700">Spotify</text>
    <text x="60" y="38" fill="#8a8aa2" font-size="10.5">link conversion only — the PC finds the same track on a service you have</text>
  </g>

  <text x="40" y="398" fill="#c9c9de" font-size="12" font-weight="700" letter-spacing="1">PLAYBACK</text>
  <line x1="40" y1="408" x2="860" y2="408" stroke="#22242f"/>
  <g transform="translate(40,420)">
    <rect x="0" y="0" width="18" height="30" rx="4" fill="none" stroke="#9aa0d8" stroke-width="2"/>
    <path d="M6 9 h6 M6 15 h6 M6 21 h6" stroke="#9aa0d8" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="13" fill="#e8e8f8" font-size="12.5" font-weight="700">ExoPlayer · Media3</text>
    <text x="34" y="30" fill="#8a8aa2" font-size="10.5">default — every source, streaming and local, MediaSession, Bluetooth</text>
  </g>
  <g transform="translate(470,420)">
    <path d="M0 30 L9 6 L18 30 Z" fill="none" stroke="#3ecfaa" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="9" cy="20" r="2.6" fill="#3ecfaa"/>
    <text x="34" y="13" fill="#e8e8f8" font-size="12.5" font-weight="700">Oboe · AAudio exclusive</text>
    <text x="34" y="30" fill="#8a8aa2" font-size="10.5">local FLAC / WAV / ALAC — gapless queue, no resample, bit-perfect readout</text>
  </g>
</svg>
