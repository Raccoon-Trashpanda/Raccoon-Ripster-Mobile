<svg xmlns="http://www.w3.org/2000/svg" width="900" height="386" viewBox="0 0 900 386" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141722"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.85" cy="0" r="1.1">
      <stop offset="0" stop-color="#ff4d8f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.05" cy="1" r="1.1">
      <stop offset="0" stop-color="#a238ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a238ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ecfaa"/>
      <stop offset="1" stop-color="#2fb894"/>
    </linearGradient>
    <linearGradient id="pinkStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d8f"/>
      <stop offset="1" stop-color="#c94fd0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="384" rx="22" fill="url(#card)" stroke="#2a2c3c"/>
  <rect x="1" y="1" width="898" height="384" rx="22" fill="url(#glowP)"/>
  <rect x="1" y="1" width="898" height="384" rx="22" fill="url(#glowV)"/>

  <text x="40" y="52" fill="#e8e8f8" font-size="20" font-weight="700" letter-spacing="0.3">Codecs</text>
  <text x="40" y="74" fill="#9494ae" font-size="12.5">What the player decodes and what downloads land as</text>

  <!-- legend -->
  <g transform="translate(636,44)">
    <circle cx="6" cy="-4" r="5" fill="none" stroke="url(#tealStroke)" stroke-width="2"/>
    <text x="18" y="0" fill="#a8a8c0" font-size="11.5">lossless</text>
    <circle cx="112" cy="-4" r="5" fill="none" stroke="url(#pinkStroke)" stroke-width="2"/>
    <text x="124" y="0" fill="#a8a8c0" font-size="11.5">lossy</text>
  </g>

  <line x1="40" y1="96" x2="860" y2="96" stroke="#22242f"/>

  <!-- ===== emblem tiles: 7 across, pitch 116, tile 74 ===== -->
  <!-- FLAC : true full-resolution wave + equals mark (bit-identical) -->
  <g transform="translate(40,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#tealStroke)" stroke-width="1.6"/>
    <path d="M12 44 C20 18 26 18 33 37 S46 66 53 44 S62 26 64 34" fill="none" stroke="url(#tealStroke)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M20 55 h34 M20 61 h34" stroke="#3ecfaa" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">FLAC</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">24-bit / 192 kHz</text>
  </g>
  <!-- ALAC : smooth wave inside an apple-notch silhouette -->
  <g transform="translate(156,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#tealStroke)" stroke-width="1.6"/>
    <path d="M37 14 c-3 -6 3 -9 7 -6 c-1 5 -4 6 -7 6 z" fill="#3ecfaa" opacity="0.9"/>
    <path d="M14 46 q7 -20 14 -6 q7 15 14 0 q7 -16 14 -2 q4 8 5 3" fill="none" stroke="url(#tealStroke)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M16 58 h42" stroke="#3ecfaa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">ALAC</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">Apple Lossless</text>
  </g>
  <!-- WAV : pure thick sine, raw PCM -->
  <g transform="translate(272,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#tealStroke)" stroke-width="1.6"/>
    <path d="M12 37 C22 12 30 62 40 37 S58 12 62 37" fill="none" stroke="url(#tealStroke)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="12" cy="37" r="2.4" fill="#3ecfaa"/>
    <circle cx="62" cy="37" r="2.4" fill="#3ecfaa"/>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">WAV</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">uncompressed PCM</text>
  </g>
  <!-- AAC : compact efficient wave, tapered envelope -->
  <g transform="translate(388,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#pinkStroke)" stroke-width="1.6"/>
    <path d="M13 37 q6 -22 12 0 q6 21 12 0 q6 -15 12 0 q6 12 12 0" fill="none" stroke="url(#pinkStroke)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M13 24 q18 -12 48 0 M13 50 q18 12 48 0" fill="none" stroke="#ff4d8f" stroke-width="1.4" opacity="0.45"/>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">AAC</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">256 kbps · M4A</text>
  </g>
  <!-- MP3 : quantised staircase wave -->
  <g transform="translate(504,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#pinkStroke)" stroke-width="1.6"/>
    <path d="M12 42 h8 v-12 h8 v18 h8 v-22 h8 v14 h8 v-8 h8 v10" fill="none" stroke="url(#pinkStroke)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">MP3</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">320 kbps</text>
  </g>
  <!-- Vorbis : wave feeding into an ogg loop -->
  <g transform="translate(620,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#pinkStroke)" stroke-width="1.6"/>
    <path d="M10 37 q6 -18 12 0 q6 18 12 0 q4 -12 8 -4" fill="none" stroke="url(#pinkStroke)" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="50" cy="37" rx="12" ry="12" fill="none" stroke="url(#pinkStroke)" stroke-width="2.4"/>
    <circle cx="50" cy="37" r="3.4" fill="#ff4d8f"/>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">Vorbis</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">OGG container</text>
  </g>
  <!-- Opus : short packet bars, low latency -->
  <g transform="translate(736,124)">
    <rect width="74" height="74" rx="17" fill="#101219" stroke="url(#pinkStroke)" stroke-width="1.6"/>
    <g stroke="url(#pinkStroke)" stroke-width="4" stroke-linecap="round">
      <path d="M15 44 v-6"/><path d="M24 44 v-16"/><path d="M33 44 v-24"/><path d="M42 44 v-12"/><path d="M51 44 v-20"/><path d="M60 44 v-8"/>
    </g>
    <text x="37" y="98" text-anchor="middle" fill="#e8e8f8" font-size="13" font-weight="700">Opus</text>
    <text x="37" y="115" text-anchor="middle" fill="#7f7f98" font-size="10">low-latency</text>
  </g>

  <line x1="40" y1="290" x2="860" y2="290" stroke="#22242f"/>
  <text x="40" y="318" fill="#9494ae" font-size="11.5">
    <tspan fill="#c9c9de" font-weight="600">Lossless path</tspan> — FLAC / ALAC / WAV decode straight through the native engine, no resample when the device rate matches.
  </text>
  <text x="40" y="340" fill="#9494ae" font-size="11.5">
    Everything else plays through the system engine. Tags are written as Vorbis comments (FLAC), ID3 (MP3) or MP4 atoms (M4A).
  </text>
  <text x="40" y="362" fill="#6a6a84" font-size="10.5">Actual bit-depth / sample-rate depends on the release and your subscription. Quality badges never invent a number they can't measure.</text>
</svg>
